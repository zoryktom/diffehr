[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffehr"
version = "0.2.0"
description = "Counterfactual contract testing for clinical AI systems on paired synthetic EHRs."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Zorykto Mykola" }
]
dependencies = [
  "pydantic>=2.6,<3"
]
keywords = [
  "biomedical-informatics",
  "clinical-ai",
  "ehr",
  "counterfactual",
  "fhir",
  "evaluation",
  "health-ai"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Software Development :: Testing"
]

[project.scripts]
diffehr = "diffehr.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5"
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10"
]
hf = [
  "transformers>=4.40",
  "torch"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_contracts.py" = ["B023"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
strict = true

[[tool.mypy.overrides]]
module = ["torch", "transformers"]
ignore_missing_imports = true
