name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/
      - name: Unit and integration tests
        run: pytest -v --cov=src/diffehr --cov-report=term-missing
      - name: Validate dataset and run offline benchmark
        run: bash scripts/run_all_benchmarks.sh
      - name: Verify raw artifacts
        run: |
          test -s evidence/runs/fuzz_findings.json
          test -s evidence/reports/full_benchmark_report.md
          test -s evidence/reports/failure_analysis.md
      - name: Verify benchmark report consistency
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path

          report = Path("evidence/reports/full_benchmark_report.md").read_text(encoding="utf-8")
          for path in sorted(Path("evidence/runs/full").glob("*.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              row = (
                  f"| {payload['model']} | {payload['n_contracts']} | {payload['passed']} | "
                  f"{payload['pass_rate']:.2%} | {payload['mean_score']:.3f} |"
              )
              if row not in report:
                  raise SystemExit(f"Missing report row for {path}: {row}")
              for key in ("generated_at", "dataset_fingerprint_sha256", "dataset_version"):
                  if key not in payload.get("run_metadata", {}):
                      raise SystemExit(f"{path} missing run_metadata.{key}")
          PY
